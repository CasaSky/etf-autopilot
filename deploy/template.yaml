AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ETF Autopilot isolated synthetic paper worker; no live broker or AI permissions
Parameters:
  ScheduleState:
    Type: String
    Default: DISABLED
    AllowedValues: [DISABLED, ENABLED]
Resources:
  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: OldStateVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt StateBucket.Arn, !Sub '${StateBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: RequireConditionalStateWrites
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${StateBucket.Arn}/paper/state.json'
            Condition:
              'Null':
                s3:if-match: 'true'
                s3:if-none-match: 'true'
  FailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PaperStateOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt StateBucket.Arn
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub '${StateBucket.Arn}/paper/state.json'
                  - !Sub '${StateBucket.Arn}/paper/inputs/current.json'
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${StateBucket.Arn}/paper/state.json'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt WorkerLogs.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt FailureQueue.Arn
  Worker:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../var/lambda.zip
      Handler: etf_autopilot.aws_handler.handler
      Runtime: python3.13
      Architectures: [x86_64]
      MemorySize: 256
      Timeout: 30
      ReservedConcurrentExecutions: 1
      Role: !GetAtt WorkerRole.Arn
      LoggingConfig:
        LogGroup: !Ref WorkerLogs
      Environment:
        Variables:
          EXECUTION_MODE: paper
          STATE_BUCKET: !Ref StateBucket
      EventInvokeConfig:
        MaximumRetryAttempts: 0
        MaximumEventAgeInSeconds: 300
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt FailureQueue.Arn
  WorkerLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-paper'
      RetentionInDays: 7
  ScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: InvokePaperWorker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt Worker.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt FailureQueue.Arn
  PaperHealthSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: Daily paper health only; does not initiate trading or fetch prices
      State: !Ref ScheduleState
      ScheduleExpression: 'cron(0 18 * * ? *)'
      ScheduleExpressionTimezone: Europe/Berlin
      FlexibleTimeWindow:
        Mode: 'OFF'
      Target:
        Arn: !GetAtt Worker.Arn
        RoleArn: !GetAtt ScheduleRole.Arn
        Input: '{"action":"health"}'
        RetryPolicy:
          MaximumRetryAttempts: 0
          MaximumEventAgeInSeconds: 300
        DeadLetterConfig:
          Arn: !GetAtt FailureQueue.Arn
Outputs:
  StateBucketName:
    Value: !Ref StateBucket
  WorkerName:
    Value: !Ref Worker
  HealthScheduleName:
    Value: !Ref PaperHealthSchedule
  FailureQueueUrl:
    Value: !Ref FailureQueue
