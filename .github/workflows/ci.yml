name: Paper system checks
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python scripts/check_private_files.py --history
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -S examples/paper_demo.py --output-dir var/ci-quickstart
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: cfn-lint deploy/template.yaml
      - run: etf-autopilot demo
      - run: python scripts/package_lambda.py
      - run: python -m build --no-isolation
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-paper-report
          path: var/paper-report.md
          retention-days: 7
