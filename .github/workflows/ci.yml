name: Paper system checks
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.1'
          terraform_wrapper: false
      - run: python scripts/check_private_files.py --history
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -S examples/paper_demo.py --output-dir var/ci-quickstart
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      - run: etf-autopilot demo
      - run: python scripts/package_lambda.py
      - run: terraform fmt -check -recursive deploy
      - run: terraform -chdir=deploy init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=deploy validate
      - run: terraform -chdir=deploy test
      - run: python -m build --no-isolation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: synthetic-paper-report
          path: var/paper-report.md
          retention-days: 7
