[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-autopilot"
version = "0.1.0"
description = "Auditable ETF paper investing and reproducible AI strategy experiments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []
keywords = ["etf", "paper-trading", "ai-agents", "mcp", "portfolio", "backtesting"]

[project.optional-dependencies]
broker = ["mcp>=1.26,<2", "jsonschema>=4.26,<5"]
aws = ["boto3>=1.40,<2"]
dev = ["pytest>=9,<10", "ruff>=0.14,<1", "pyyaml>=6,<7", "build>=1,<2", "cfn-lint>=1.40,<2"]

[project.scripts]
etf-autopilot = "etf_autopilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
